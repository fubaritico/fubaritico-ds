# sonar-project.properties
sonar.projectKey=fubaritico-ds
sonar.organization=fubaritico

# Only packages hold source today (apps/storybook-* are empty scaffolds).
sonar.sources=packages

# node_modules / build output / coverage / tests, plus Stencil generated artefacts.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.*,**/*.spec.*,packages/stencil/dist/**,**/components.d.ts

# Per-package lcov (monorepo — no merged root report). stencil joins once it has specs.
sonar.javascript.lcov.reportPaths=packages/reference/coverage/lcov.info,packages/shared/coverage/lcov.info,packages/stencil/coverage/lcov.info
