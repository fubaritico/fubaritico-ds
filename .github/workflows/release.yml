name: Release

# Publishes the design-system packages to GitHub Packages (npm.pkg.github.com, scope @fubaritico).
# Manual on purpose: bump first with `pnpm exec lerna version <minor|patch> --yes` (fixed mode —
# the packages changed since the last tag move to one shared version; lerna pushes the commit + tag),
# then run this workflow. It builds and publishes only: the tests ran in the pre-commit hook and in
# ci.yml. Full procedure: README.md → "Publishing a release", or the /release skill.
# `pnpm publish -r` skips private packages and versions already on the registry, so a re-run is safe.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and report what would be published, without publishing
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # Writes the .npmrc that maps @fubaritico to GitHub Packages and reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@fubaritico'

      - name: Build
        run: pnpm build:packages

      - name: Publish
        run: pnpm -r --filter "./packages/*" publish --no-git-checks ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
