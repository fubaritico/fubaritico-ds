name: SonarQube Analysis

on:
  workflow_call:

# Self-skips when SONAR_TOKEN is absent (no SonarCloud project / secret yet), so the first push
# stays green. The scan activates automatically once the SONAR_TOKEN Actions secret is added.
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for accurate blame / new-code detection

      - uses: ./.github/actions/setup

      - name: Check SONAR_TOKEN presence
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "has=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Generate coverage (lcov for Sonar)
        if: steps.check.outputs.has == 'true'
        run: pnpm coverage

      - name: SonarQube Scan
        if: steps.check.outputs.has == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip notice
        if: steps.check.outputs.has != 'true'
        run: echo "ℹ️ SONAR_TOKEN absent — Sonar scan skipped. Add the secret to enable it."
