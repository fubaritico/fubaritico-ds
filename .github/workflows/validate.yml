name: Validate

on:
  workflow_call:

# lint / type-check / test run in parallel. Cross-package types resolve from dist/*.d.ts, so
# Nx builds dependencies first via `dependsOn: ['^build']` (nx.json) — no manual pre-build needed.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Run lint
        run: pnpm lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Run type check
        run: pnpm type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm test
