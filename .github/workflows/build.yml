name: Build

on:
  workflow_call:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # Excludes @fubaritico-ds/stencil: `stencil build` fails until PLAN step 5
      # (src/global/ui-stencil.css) is done. Add stencil to the build once it's green.
      - name: Build packages
        run: pnpm build:packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ github.sha }}
          path: packages/*/dist
          retention-days: 1
          if-no-files-found: error

