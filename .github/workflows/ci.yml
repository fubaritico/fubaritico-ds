name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: [validate]
    uses: ./.github/workflows/build.yml

  sonarqube:
    needs: [build]
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit

  quality-gate:
    runs-on: ubuntu-latest
    needs: [validate, build, sonarqube]
    if: always()
    steps:
      - name: Check all checks passed
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Quality gate failed (validate=${{ needs.validate.result }}, build=${{ needs.build.result }})"
            exit 1
          fi
          # sonarqube self-skips when SONAR_TOKEN is absent → "skipped" is tolerated, only "failure" blocks.
          if [ "${{ needs.sonarqube.result }}" == "failure" ]; then
            echo "❌ Quality gate failed (sonarqube=failure)"
            exit 1
          fi
          echo "✅ Quality gate passed (sonarqube=${{ needs.sonarqube.result }})"
