name: Setup Node & pnpm
description: Common setup for all jobs — pnpm, Node (cached), frozen install. No pre-build (Nx builds deps per task via dependsOn ^build).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.8.1

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
